[project]
name = "car-sim"
version = "0.0.1"
dependencies = [
    "pydantic >=1.10.0",
    "typer >=0.9.0",
    "python >= 3.8"
]


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
